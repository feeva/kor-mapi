<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kor-mapi demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ──────────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #toolbar h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #a5b4fc;
      margin-right: 6px;
    }

    #toolbar .sep {
      width: 1px;
      height: 20px;
      background: #2d3148;
    }

    select, button {
      background: #252836;
      color: #e2e8f0;
      border: 1px solid #3d4266;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    select:hover, button:hover {
      background: #2e3347;
      border-color: #6366f1;
    }
    button:active { background: #1e2133; }

    #btn-clear { color: #f87171; border-color: #7f1d1d; }
    #btn-clear:hover { background: #2e1515; border-color: #f87171; }

    /* ── Map columns ──────────────────────────────────────────── */
    #maps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      flex: 1;
      min-height: 0;
      gap: 1px;
      background: #2d3148;
    }

    .map-col {
      display: flex;
      flex-direction: column;
      background: #0f1117;
      min-height: 0;
    }

    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      background: #1a1d27;
      flex-shrink: 0;
    }

    .map-header .provider-name {
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .provider-name.naver  { color: #4ade80; }
    .provider-name.kakao  { color: #fbbf24; }
    .provider-name.google { color: #60a5fa; }

    .capabilities {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .cap-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .cap-badge.yes { background: #14532d; color: #4ade80; }
    .cap-badge.no  { background: #1c1c2e; color: #4b5563; }

    .map-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .map-el {
      width: 100%;
      height: 100%;
    }

    .map-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #4b5563;
      padding: 20px;
      text-align: center;
    }
    .map-placeholder .icon { font-size: 32px; }
    .map-placeholder .title { font-size: 13px; font-weight: 600; color: #6b7280; }
    .map-placeholder .hint  { font-size: 11px; line-height: 1.5; }
    .map-placeholder code {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
    }

    /* ── Event log ────────────────────────────────────────────── */
    #log-bar {
      height: 90px;
      flex-shrink: 0;
      background: #0c0e16;
      border-top: 1px solid #2d3148;
      overflow-y: auto;
      padding: 4px 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
    }

    #log-bar::-webkit-scrollbar { width: 4px; }
    #log-bar::-webkit-scrollbar-track { background: transparent; }
    #log-bar::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 2px; }

    .log-entry { display: flex; gap: 6px; }
    .log-tag {
      font-weight: 700;
      flex-shrink: 0;
      width: 52px;
    }
    .log-tag.naver  { color: #4ade80; }
    .log-tag.kakao  { color: #fbbf24; }
    .log-tag.google { color: #60a5fa; }
    .log-msg { color: #94a3b8; }
    .log-empty { color: #374151; font-style: italic; }
  </style>
</head>
<body>

  <!-- Toolbar -->
  <div id="toolbar">
    <h1>kor-mapi</h1>
    <div class="sep"></div>
    <label for="sel-maptype" style="color:#94a3b8">Type</label>
    <select id="sel-maptype">
      <option value="roadmap">Roadmap</option>
      <option value="satellite">Satellite</option>
      <option value="hybrid">Hybrid</option>
      <option value="terrain">Terrain</option>
    </select>
    <div class="sep"></div>
    <button id="btn-marker">+ Marker</button>
    <button id="btn-polyline">+ Polyline</button>
    <button id="btn-circle">+ Circle</button>
    <button id="btn-cluster">+ Cluster</button>
    <button id="btn-clear">✕ Clear</button>
  </div>

  <!-- Three map columns -->
  <div id="maps">
    <div class="map-col" id="col-naver">
      <div class="map-header">
        <span class="provider-name naver">Naver</span>
        <div class="capabilities" id="caps-naver"></div>
      </div>
      <div class="map-container">
        <div class="map-el" id="map-naver"></div>
      </div>
    </div>

    <div class="map-col" id="col-kakao">
      <div class="map-header">
        <span class="provider-name kakao">Kakao</span>
        <div class="capabilities" id="caps-kakao"></div>
      </div>
      <div class="map-container">
        <div class="map-el" id="map-kakao"></div>
      </div>
    </div>

    <div class="map-col" id="col-google">
      <div class="map-header">
        <span class="provider-name google">Google</span>
        <div class="capabilities" id="caps-google"></div>
      </div>
      <div class="map-container">
        <div class="map-el" id="map-google"></div>
      </div>
    </div>
  </div>

  <!-- Event log -->
  <div id="log-bar">
    <div class="log-empty">Events will appear here as you interact with the maps…</div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
